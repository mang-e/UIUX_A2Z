<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A2Z 키캡 & 클리커 3D 체험관</title>
    <!-- SUIT Variable Font -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js r128 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --ink: #1C1C20;
            --paper: #FEFEFE;
            --g1: #E1E5EA;
            --blue: #1C94F5;
            --r-pill: 38px;
        }

        * {
            font-family: 'SUIT Variable', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            background-color: var(--paper);
            color: var(--ink);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            margin: 0;
        }

        .a2z-btn {
            background-color: var(--paper);
            color: var(--ink);
            border: 2px solid var(--ink);
            border-radius: var(--r-pill);
            font-weight: 800;
            transition: all 0.15s ease;
        }

        .a2z-btn:hover {
            background-color: var(--g1);
        }

        .a2z-btn.active {
            background-color: var(--ink);
            color: var(--paper);
        }

        #webgl-canvas {
            width: 100vw;
            height: 100vh;
            display: block;
            cursor: grab;
        }

        #webgl-canvas:active {
            cursor: grabbing;
        }
    </style>
</head>
<body class="relative">

    <!-- 3D WebGL Canvas -->
    <canvas id="webgl-canvas"></canvas>

    <!-- 상단 제어 바 -->
    <div class="absolute top-6 left-0 right-0 z-20 flex flex-col items-center gap-3.5 px-4 pointer-events-none">
        <!-- 메인 탭 -->
        <div class="pointer-events-auto flex bg-[#FEFEFE] border-2 border-[#1C1C20] rounded-full p-1 shadow-sm">
            <button id="tab-keycap" onclick="switchMainTab('keycap')" class="a2z-btn active px-8 py-2.5 text-sm md:text-base">
                키캡
            </button>
            <button id="tab-clicker" onclick="switchMainTab('clicker')" class="a2z-btn px-8 py-2.5 text-sm md:text-base border-transparent hover:border-[#1C1C20]">
                클리커
            </button>
        </div>

        <!-- 클리커 서브 선택 -->
        <div id="clicker-selector" class="hidden pointer-events-auto flex flex-wrap justify-center gap-2">
            <button onclick="selectClicker('clover')" id="btn-clover" class="a2z-btn active px-5 py-1.5 text-xs md:text-sm">
                클로버
            </button>
            <button onclick="selectClicker('omurice')" id="btn-omurice" class="a2z-btn px-5 py-1.5 text-xs md:text-sm">
                오므라이스
            </button>
            <button onclick="selectClicker('dumpling')" id="btn-dumpling" class="a2z-btn px-5 py-1.5 text-xs md:text-sm">
                만두
            </button>
        </div>
    </div>

    <!-- 음향 설정 버튼 -->
    <div class="absolute bottom-6 right-6 z-20 flex gap-3">
        <button id="btn-sound" onclick="toggleSound()" title="음향 설정" class="w-12 h-12 rounded-full border-2 border-[#1C1C20] bg-[#FEFEFE] text-[#1C1C20] flex items-center justify-center hover:bg-[#1C1C20] hover:text-white transition-all">
            <i id="sound-icon" class="fa-solid fa-volume-high text-lg"></i>
        </button>
    </div>

    <script>
        /* =========================================================================
           1. 사운드 웹 오디오 엔진 (키보드 타건음 & 클리커 딸깍음)
           ========================================================================= */
        class RealAudioEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
                this.lastSoundTime = 0;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // 기계식 키보드 타건음 ("도글-탁!")
            playKeycapThock() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;

                if (now - this.lastSoundTime < 0.05) return;
                this.lastSoundTime = now;

                const noiseBuf = this.createNoiseBuffer(0.02);
                const noiseSrc = this.ctx.createBufferSource();
                const filter = this.ctx.createBiquadFilter();
                const gain = this.ctx.createGain();

                noiseSrc.buffer = noiseBuf;
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(3100, now);
                filter.Q.setValueAtTime(3.8, now);

                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.018);

                noiseSrc.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                noiseSrc.start(now);
                noiseSrc.stop(now + 0.02);

                const osc = this.ctx.createOscillator();
                const oscFilter = this.ctx.createBiquadFilter();
                const oscGain = this.ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(110, now + 0.042);

                oscFilter.type = 'lowpass';
                oscFilter.frequency.setValueAtTime(800, now);

                oscGain.gain.setValueAtTime(0.6, now);
                oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);

                osc.connect(oscFilter);
                oscFilter.connect(oscGain);
                oscGain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.048);
            }

            // 클리커 "딸깍!" 스위치 클릭음
            playClickerSnap() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;

                if (now - this.lastSoundTime < 0.05) return;
                this.lastSoundTime = now;

                const snapBuf = this.createNoiseBuffer(0.015);
                const snapSrc = this.ctx.createBufferSource();
                const snapFilter = this.ctx.createBiquadFilter();
                const snapGain = this.ctx.createGain();

                snapSrc.buffer = snapBuf;
                snapFilter.type = 'highpass';
                snapFilter.frequency.setValueAtTime(3500, now);

                snapGain.gain.setValueAtTime(0.65, now);
                snapGain.gain.exponentialRampToValueAtTime(0.001, now + 0.014);

                snapSrc.connect(snapFilter);
                snapFilter.connect(snapGain);
                snapGain.connect(this.ctx.destination);

                snapSrc.start(now);
                snapSrc.stop(now + 0.015);

                setTimeout(() => {
                    if (!this.ctx) return;
                    const t = this.ctx.currentTime;
                    const popOsc = this.ctx.createOscillator();
                    const popGain = this.ctx.createGain();

                    popOsc.type = 'sine';
                    popOsc.frequency.setValueAtTime(1450, t);
                    popOsc.frequency.exponentialRampToValueAtTime(400, t + 0.02);

                    popGain.gain.setValueAtTime(0.38, t);
                    popGain.gain.exponentialRampToValueAtTime(0.001, t + 0.022);

                    popOsc.connect(popGain);
                    popGain.connect(this.ctx.destination);

                    popOsc.start(t);
                    popOsc.stop(t + 0.025);
                }, 10);
            }

            createNoiseBuffer(duration) {
                const bufferSize = this.ctx.sampleRate * duration;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                return buffer;
            }
        }

        const soundEngine = new RealAudioEngine();

        /* =========================================================================
           2. THREE.JS 3D 씬 및 모델링
           ========================================================================= */
        let scene, camera, renderer, currentMeshGroup;
        let activeMainTab = 'keycap';
        let currentClickerType = 'clover';

        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let isPointerDown = false;
        let previousMousePosition = { x: 0, y: 0 };

        let pressableParts = [];

        function init3D() {
            const canvas = document.getElementById('webgl-canvas');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xfefeef);

            camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(2.4, 3.2, 4.2);
            camera.lookAt(0, -0.1, 0);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.52);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xffffff, 0.55);
            mainLight.position.set(4, 7, 5);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 1024;
            mainLight.shadow.mapSize.height = 1024;
            scene.add(mainLight);

            const fillLight1 = new THREE.DirectionalLight(0xfffae6, 0.35);
            fillLight1.position.set(-4, 3, -3);
            scene.add(fillLight1);

            const fillLight2 = new THREE.DirectionalLight(0xffffff, 0.3);
            fillLight2.position.set(0, -3, 3);
            scene.add(fillLight2);

            currentMeshGroup = new THREE.Group();
            scene.add(currentMeshGroup);

            buildKeycapTesterModel();
            setupEventListeners();
            animate();
        }

        function clearCurrentGroup() {
            pressableParts = [];
            while (currentMeshGroup.children.length > 0) {
                const obj = currentMeshGroup.children[0];
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) {
                    if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
                    else obj.material.dispose();
                }
                currentMeshGroup.remove(obj);
            }
            currentMeshGroup.rotation.set(0, 0, 0);
            currentMeshGroup.position.set(0, 0, 0);
            currentMeshGroup.scale.set(1, 1, 1);
        }

        /* -------------------------------------------------------------------------
           [모델 1] 키캡 (투명 아크릴 하우징 depthWrite 보정)
           ------------------------------------------------------------------------- */
        function buildKeycapTesterModel() {
            clearCurrentGroup();

            const acrylicGeo = new THREE.BoxGeometry(4.4, 0.72, 1.3);
            const acrylicMat = new THREE.MeshPhysicalMaterial({
                color: 0xf0f4f8,
                roughness: 0.1,
                metalness: 0.05,
                transmission: 0.65,
                opacity: 0.95,
                transparent: true,
                depthWrite: true,
                clearcoat: 1.0,
                clearcoatRoughness: 0.1
            });
            const acrylicBase = new THREE.Mesh(acrylicGeo, acrylicMat);
            acrylicBase.position.y = -0.38;
            acrylicBase.castShadow = true;
            acrylicBase.receiveShadow = true;
            currentMeshGroup.add(acrylicBase);

            const keyColors = [0xff9ebb, 0x80e5ff, 0xe0aaff, 0xffee93];
            const xPositions = [-1.5, -0.5, 0.5, 1.5];

            const switchHousingMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.8, roughness: 0.2, depthWrite: true });
            const stemMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
            const contactMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.8, roughness: 0.2 });

            xPositions.forEach((xPos, idx) => {
                const socketMesh = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.45, 0.85), switchHousingMat);
                socketMesh.position.set(xPos, -0.12, 0);
                currentMeshGroup.add(socketMesh);

                const contactMesh = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.28, 0.38), contactMat);
                contactMesh.position.set(xPos - 0.18, -0.12, 0);
                currentMeshGroup.add(contactMesh);

                const stemGroup = new THREE.Group();
                const stemV = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.4, 0.35), stemMat);
                const stemH = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.4, 0.15), stemMat);
                stemGroup.add(stemV);
                stemGroup.add(stemH);
                stemGroup.position.set(xPos, 0.1, 0);
                currentMeshGroup.add(stemGroup);

                const keycapGroup = new THREE.Group();
                const capGeo = new THREE.CylinderGeometry(0.4, 0.52, 0.48, 4, 1);
                capGeo.rotateY(Math.PI / 4);

                const capMat = new THREE.MeshPhysicalMaterial({
                    color: keyColors[idx],
                    roughness: 0.35,
                    clearcoat: 0.35,
                    clearcoatRoughness: 0.2
                });

                const capMesh = new THREE.Mesh(capGeo, capMat);
                capMesh.castShadow = true;
                keycapGroup.add(capMesh);

                keycapGroup.position.set(xPos, 0.48, 0);
                currentMeshGroup.add(keycapGroup);

                pressableParts.push({
                    mesh: keycapGroup,
                    origY: 0.48,
                    pressY: 0.26,
                    currentY: 0.48,
                    isPressed: false,
                    type: 'keycap'
                });
            });

            currentMeshGroup.rotation.y = -Math.PI / 8;
        }

        /* -------------------------------------------------------------------------
           [모델 2] 클로버 클리커 (슬림하우징 & 팁 밀착 4잎)
           ------------------------------------------------------------------------- */
        function buildCloverClicker() {
            clearCurrentGroup();

            const housingMat = new THREE.MeshStandardMaterial({ color: 0x186a3b, roughness: 0.4 });
            const cloverHousingGroup = new THREE.Group();

            const lobeGeo = new THREE.CylinderGeometry(0.58, 0.58, 0.28, 32);
            const dist = 0.38;
            const angles = [0, Math.PI / 2, Math.PI, Math.PI * 1.5];

            angles.forEach(ang => {
                const lobe = new THREE.Mesh(lobeGeo, housingMat);
                lobe.position.set(Math.cos(ang) * dist, -0.14, Math.sin(ang) * dist);
                lobe.castShadow = true;
                cloverHousingGroup.add(lobe);
            });

            const centerCore = new THREE.Mesh(new THREE.CylinderGeometry(0.58, 0.58, 0.28, 32), housingMat);
            centerCore.position.y = -0.14;
            cloverHousingGroup.add(centerCore);

            currentMeshGroup.add(cloverHousingGroup);

            const heartShape = new THREE.Shape();
            heartShape.moveTo(0, 0);
            heartShape.bezierCurveTo(-0.05, 0.1, -0.32, 0.22, -0.32, 0.48);
            heartShape.bezierCurveTo(-0.32, 0.72, -0.14, 0.82, 0, 0.62);
            heartShape.bezierCurveTo(0.14, 0.82, 0.32, 0.72, 0.32, 0.48);
            heartShape.bezierCurveTo(0.32, 0.22, 0.05, 0.1, 0, 0);

            const extrudeSettings = { depth: 0.32, bevelEnabled: true, bevelThickness: 0.04, bevelSize: 0.03, bevelSegments: 3 };
            const heartGeo = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
            heartGeo.rotateX(-Math.PI / 2);

            angles.forEach((ang) => {
                const leafGroup = new THREE.Group();
                const leafMat = new THREE.MeshStandardMaterial({
                    color: 0x2ecc71,
                    emissive: 0x000000,
                    roughness: 0.3
                });

                const heartMesh = new THREE.Mesh(heartGeo, leafMat);
                heartMesh.castShadow = true;
                leafGroup.add(heartMesh);

                leafGroup.rotation.y = -ang - Math.PI / 2;
                leafGroup.position.set(0, 0.02, 0);
                currentMeshGroup.add(leafGroup);

                pressableParts.push({
                    mesh: leafGroup,
                    leafMat: leafMat,
                    origY: 0.02,
                    pressY: -0.1,
                    currentY: 0.02,
                    isPressed: false,
                    type: 'clicker'
                });
            });
        }

        /* -------------------------------------------------------------------------
           [모델 3] 오므라이스 클리커 (짜낸 3D 케첩 라인 아트 & 도톰한 가니쉬 전면 노출)
           ------------------------------------------------------------------------- */
        function buildOmuriceClicker() {
            clearCurrentGroup();

            // 1) 접시
            const plateGeo = new THREE.CylinderGeometry(1.7, 1.55, 0.18, 32);
            plateGeo.scale(1.2, 1.0, 1.0);
            const plateMat = new THREE.MeshStandardMaterial({ color: 0xf8f9fa, roughness: 0.25 });
            const plateMesh = new THREE.Mesh(plateGeo, plateMat);
            plateMesh.position.y = -0.28;
            plateMesh.castShadow = true;
            currentMeshGroup.add(plateMesh);

            const sauceRingGeo = new THREE.TorusGeometry(1.48, 0.035, 8, 32);
            sauceRingGeo.rotateX(Math.PI / 2);
            sauceRingGeo.scale(1.18, 0.96, 1.0);
            const sauceMat = new THREE.MeshStandardMaterial({ color: 0xe53935, roughness: 0.3 });
            const sauceRing = new THREE.Mesh(sauceRingGeo, sauceMat);
            sauceRing.position.y = -0.18;
            currentMeshGroup.add(sauceRing);

            const demiGeo = new THREE.CylinderGeometry(1.38, 1.38, 0.06, 32);
            demiGeo.scale(1.15, 1.0, 0.9);
            const demiMat = new THREE.MeshStandardMaterial({ color: 0x4a2311, roughness: 0.4 });
            const demiMesh = new THREE.Mesh(demiGeo, demiMat);
            demiMesh.position.y = -0.17;
            currentMeshGroup.add(demiMesh);

            // 2) 가니쉬 (계란 밖 접시 우측/좌측으로 끌어올려 100% 또렷이 노출)
            const peaGeo = new THREE.SphereGeometry(0.12, 12, 12);
            const peaMat = new THREE.MeshStandardMaterial({ color: 0x27ae60, roughness: 0.3 });
            [ [0.85, 0.0, 0.42], [0.98, 0.0, 0.3], [0.92, 0.0, 0.54], [1.08, 0.0, 0.45] ].forEach(p => {
                const pea = new THREE.Mesh(peaGeo, peaMat);
                pea.position.set(p[0], p[1], p[2]);
                currentMeshGroup.add(pea);
            });

            const tomatoGeo = new THREE.SphereGeometry(0.18, 16, 16);
            const tomatoMat = new THREE.MeshStandardMaterial({ color: 0xe53935, roughness: 0.2 });
            [ [-0.85, 0.04, 0.52], [-1.02, 0.04, 0.38] ].forEach(p => {
                const tom = new THREE.Mesh(tomatoGeo, tomatoMat);
                tom.position.set(p[0], p[1], p[2]);
                currentMeshGroup.add(tom);
            });

            // 3) 노란 계란 바디
            const eggGroup = new THREE.Group();
            const eggGeo = new THREE.SphereGeometry(1.0, 32, 32);
            eggGeo.scale(1.1, 0.5, 0.82);
            const eggMat = new THREE.MeshStandardMaterial({ color: 0xffca28, roughness: 0.45 });

            const eggMesh = new THREE.Mesh(eggGeo, eggMat);
            eggMesh.castShadow = true;
            eggGroup.add(eggMesh);

            // 4) 진짜 튜브로 짜낸 듯한 3D 케첩 라인 아트 (TubeGeometry)
            const curvePoints = [];
            const numPts = 60;
            const a = 1.1, b = 0.5, c = 0.82;

            for (let i = 0; i <= numPts; i++) {
                const t = (i / numPts) * Math.PI * 2;
                // 2D 하트 라인 수학 공식
                const hx = (16 * Math.pow(Math.sin(t), 3)) / 16.0 * 0.36;
                const hz = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 16.0 * 0.36;
                
                // 계란 타원체 곡면에 착 밀착 계산
                const radSq = Math.pow(hx / a, 2) + Math.pow(hz / c, 2);
                const hy = b * Math.sqrt(Math.max(0.001, 1.0 - radSq)) + 0.015;
                
                curvePoints.push(new THREE.Vector3(hx, hy, hz));
            }

            const heartCurve = new THREE.CatmullRomCurve3(curvePoints, true);
            const ketchupTubeGeo = new THREE.TubeGeometry(heartCurve, 64, 0.032, 12, true);

            const ketchupMat = new THREE.MeshPhysicalMaterial({
                color: 0xd63031,
                roughness: 0.15,
                clearcoat: 1.0,
                clearcoatRoughness: 0.1
            });

            const ketchupMesh = new THREE.Mesh(ketchupTubeGeo, ketchupMat);
            ketchupMesh.castShadow = true;
            eggGroup.add(ketchupMesh);

            eggGroup.position.y = 0.12;
            currentMeshGroup.add(eggGroup);

            pressableParts.push({
                mesh: eggGroup,
                origY: 0.12,
                pressY: -0.06,
                currentY: 0.12,
                isPressed: false,
                type: 'clicker'
            });
        }

        /* -------------------------------------------------------------------------
           [모델 4] 만두 클리커 (고소한 만두피 색상 & 감싸는 찜기)
           ------------------------------------------------------------------------- */
        function buildDumplingClicker() {
            clearCurrentGroup();

            const steamerGeo = new THREE.CylinderGeometry(1.25, 1.25, 0.75, 32, 1, true);
            const steamerMat = new THREE.MeshStandardMaterial({
                color: 0xc89d5c,
                roughness: 0.6,
                side: THREE.DoubleSide
            });
            const steamer = new THREE.Mesh(steamerGeo, steamerMat);
            steamer.position.y = -0.1;
            steamer.castShadow = true;
            currentMeshGroup.add(steamer);

            const ringGeo = new THREE.TorusGeometry(1.26, 0.045, 8, 32);
            ringGeo.rotateX(Math.PI / 2);
            const ringMat = new THREE.MeshStandardMaterial({ color: 0x936b33, roughness: 0.5 });

            const r1 = new THREE.Mesh(ringGeo, ringMat);
            r1.position.y = 0.27;
            currentMeshGroup.add(r1);

            const r2 = new THREE.Mesh(ringGeo, ringMat);
            r2.position.y = -0.47;
            currentMeshGroup.add(r2);

            const innerFloor = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 0.1, 32), new THREE.MeshStandardMaterial({ color: 0x5a3b1a, roughness: 0.8 }));
            innerFloor.position.y = -0.15;
            currentMeshGroup.add(innerFloor);

            const dumplingGroup = new THREE.Group();
            const dumplingGeo = new THREE.SphereGeometry(1.18, 48, 32);
            dumplingGeo.scale(1.0, 0.76, 1.0);

            const posAttr = dumplingGeo.attributes.position;
            for (let i = 0; i < posAttr.count; i++) {
                let x = posAttr.getX(i);
                let y = posAttr.getY(i);
                let z = posAttr.getZ(i);

                if (y > -0.1) {
                    const angle = Math.atan2(z, x);
                    const heightFactor = Math.pow((y + 0.1) / 0.8, 1.2);
                    const fold = Math.sin(angle * 16) * 0.08 * heightFactor;

                    posAttr.setXYZ(i, x + Math.cos(angle) * fold, y, z + Math.sin(angle) * fold);
                }
            }
            dumplingGeo.computeVertexNormals();

            const dumplingMat = new THREE.MeshStandardMaterial({
                color: 0xf5efe0,
                roughness: 0.55,
                metalness: 0.05
            });

            const dumplingMesh = new THREE.Mesh(dumplingGeo, dumplingMat);
            dumplingMesh.castShadow = true;
            dumplingGroup.add(dumplingMesh);

            dumplingGroup.position.y = 0.22;
            currentMeshGroup.add(dumplingGroup);

            pressableParts.push({
                mesh: dumplingGroup,
                origY: 0.22,
                pressY: 0.02,
                currentY: 0.22,
                isPressed: false,
                type: 'clicker'
            });
        }

        /* =========================================================================
           3. 마우스/터치 물리 반응 및 애니메이션
           ========================================================================= */
        function setupEventListeners() {
            const canvas = document.getElementById('webgl-canvas');
            document.addEventListener('contextmenu', e => e.preventDefault());

            canvas.addEventListener('pointerdown', onPointerDown);
            canvas.addEventListener('pointermove', onPointerMove);
            canvas.addEventListener('pointerup', onPointerUp);
            canvas.addEventListener('pointercancel', onPointerUp);

            window.addEventListener('resize', onWindowResize);
        }

        function updateMouseCoords(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        }

        function onPointerDown(e) {
            isPointerDown = true;
            updateMouseCoords(e);
            previousMousePosition = { x: e.clientX, y: e.clientY };

            raycaster.setFromCamera(mouse, camera);

            for (let i = 0; i < pressableParts.length; i++) {
                const part = pressableParts[i];
                const intersects = raycaster.intersectObject(part.mesh, true);
                if (intersects.length > 0) {
                    part.isPressed = true;

                    if (part.type === 'keycap') {
                        soundEngine.playKeycapThock();
                    } else {
                        soundEngine.playClickerSnap();
                        if (part.leafMat) {
                            part.leafMat.emissive.setHex(0x33ff33);
                        }
                    }
                    break;
                }
            }
        }

        function onPointerMove(e) {
            if (!isPointerDown) return;

            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            currentMeshGroup.rotation.y += deltaX * 0.008;
            currentMeshGroup.rotation.x += deltaY * 0.008;

            previousMousePosition = { x: e.clientX, y: e.clientY };
        }

        function onPointerUp() {
            isPointerDown = false;
            pressableParts.forEach(part => {
                part.isPressed = false;
                if (part.leafMat) {
                    part.leafMat.emissive.setHex(0x000000);
                }
            });
        }

        function updatePhysics() {
            pressableParts.forEach(part => {
                const targetY = part.isPressed ? part.pressY : part.origY;
                part.currentY += (targetY - part.currentY) * 0.38;
                part.mesh.position.y = part.currentY;
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        /* =========================================================================
           4. 탭 제어
           ========================================================================= */
        function switchMainTab(mainTab) {
            activeMainTab = mainTab;

            const btnKeycap = document.getElementById('tab-keycap');
            const btnClicker = document.getElementById('tab-clicker');
            const clickerSelector = document.getElementById('clicker-selector');

            if (mainTab === 'keycap') {
                btnKeycap.classList.add('active');
                btnClicker.classList.remove('active');
                clickerSelector.classList.add('hidden');

                buildKeycapTesterModel();
            } else {
                btnClicker.classList.add('active');
                btnKeycap.classList.remove('active');
                clickerSelector.classList.remove('hidden');

                selectClicker(currentClickerType);
            }
        }

        function selectClicker(type) {
            currentClickerType = type;

            ['clover', 'omurice', 'dumpling'].forEach(t => {
                const btn = document.getElementById(`btn-${t}`);
                if (t === type) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            if (type === 'clover') buildCloverClicker();
            else if (type === 'omurice') buildOmuriceClicker();
            else if (type === 'dumpling') buildDumplingClicker();
        }

        function toggleSound() {
            soundEngine.enabled = !soundEngine.enabled;
            const soundIcon = document.getElementById('sound-icon');
            if (soundEngine.enabled) {
                soundIcon.className = 'fa-solid fa-volume-high text-lg';
            } else {
                soundIcon.className = 'fa-solid fa-volume-xmark text-lg text-red-500';
            }
        }

        window.onload = function() {
            init3D();
            switchMainTab('keycap');
        };
    </script>
</body>
</html>
