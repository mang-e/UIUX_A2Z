<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A2Z 말랑이 & 왁뿌볼 3D 체험관</title>
    <!-- SUIT Variable Font -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js r128 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --ink: #1C1C20;
            --paper: #FEFEFE;
            --g1: #E1E5EA;
            --blue: #1C94F5;
            --r-pill: 38px;
        }

        * {
            font-family: 'SUIT Variable', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            background-color: var(--paper);
            color: var(--ink);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            margin: 0;
        }

        .a2z-btn {
            background-color: var(--paper);
            color: var(--ink);
            border: 2px solid var(--ink);
            border-radius: var(--r-pill);
            font-weight: 800;
            transition: all 0.15s ease;
        }

        .a2z-btn:hover {
            background-color: var(--g1);
        }

        .a2z-btn.active {
            background-color: var(--ink);
            color: var(--paper);
        }

        #webgl-canvas {
            width: 100vw;
            height: 100vh;
            display: block;
            cursor: grab;
        }

        #webgl-canvas:active {
            cursor: grabbing;
        }
    </style>
</head>
<body class="relative">

    <!-- 3D WebGL Canvas -->
    <canvas id="webgl-canvas"></canvas>

    <!-- 상단 제어 바 -->
    <div class="absolute top-6 left-0 right-0 z-20 flex flex-col items-center gap-3.5 px-4 pointer-events-none">
        <!-- 메인 탭 -->
        <div class="pointer-events-auto flex bg-[#FEFEFE] border-2 border-[#1C1C20] rounded-full p-1">
            <button id="tab-mallang" onclick="switchTab('mallang')" class="a2z-btn active px-7 py-2.5 text-sm md:text-base">
                말랑이
            </button>
            <button id="tab-wax" onclick="switchTab('wax')" class="a2z-btn px-7 py-2.5 text-sm md:text-base border-transparent hover:border-[#1C1C20]">
                왁뿌볼
            </button>
        </div>

        <!-- 서브 탭 (말랑이 선택) -->
        <div id="mallang-selector" class="pointer-events-auto flex flex-wrap justify-center gap-2">
            <button onclick="selectMallang('butter')" id="btn-butter" class="a2z-btn active px-4 py-1.5 text-xs md:text-sm">
                버터바 크런치
            </button>
            <button onclick="selectMallang('watermelon')" id="btn-watermelon" class="a2z-btn px-4 py-1.5 text-xs md:text-sm">
                수박 샤베트
            </button>
            <button onclick="selectMallang('cheese')" id="btn-cheese" class="a2z-btn px-4 py-1.5 text-xs md:text-sm">
                치즈
            </button>
        </div>
    </div>

    <!-- 왁뿌볼 3단계 미니 게이지 프로그레스 바 -->
    <div id="wax-bar-container" class="hidden absolute bottom-12 left-1/2 -translate-x-1/2 z-20 pointer-events-none">
        <div class="w-56 h-4 bg-[#E1E5EA] border-2 border-[#1C1C20] rounded-full overflow-hidden p-0.5 shadow-sm">
            <div id="crack-bar" class="bg-[#1C94F5] h-full rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
    </div>

    <!-- 우측 하단 버튼 -->
    <div class="absolute bottom-6 right-6 z-20 flex gap-3">
        <button id="btn-reset" onclick="rewrapWax()" title="다시 씌우기" class="hidden w-12 h-12 rounded-full border-2 border-[#1C1C20] bg-[#FEFEFE] text-[#1C1C20] flex items-center justify-center hover:bg-[#1C1C20] hover:text-white transition-all">
            <i class="fa-solid fa-rotate-left text-lg"></i>
        </button>
        <button id="btn-sound" onclick="toggleSound()" title="음향 설정" class="w-12 h-12 rounded-full border-2 border-[#1C1C20] bg-[#FEFEFE] text-[#1C1C20] flex items-center justify-center hover:bg-[#1C1C20] hover:text-white transition-all">
            <i id="sound-icon" class="fa-solid fa-volume-high text-lg"></i>
        </button>
    </div>

    <script>
        /* =========================================================================
           1. 찰진 고주파 습식 흡착 오디오 엔진 ('둥둥' 저음 100% 제거)
           ========================================================================= */
        class RealSoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
                this.isCheesePlaying = false;
                this.lastCheeseTime = 0;
                this.lastCrunchTime = 0;
                this.sorbetGain = null;
                this.sorbetFilter = null;
                this.sorbetSource = null;
                this.isSorbetRunning = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // 치즈 & 연두색 속 알맹이: 둥둥거리는 저음 전면 차단 -> 리얼 '쮹-' 찰진 습식 마찰음
            playStickySquishSound() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;

                if (this.isCheesePlaying || (now - this.lastCheeseTime < 0.28)) return;
                this.isCheesePlaying = true;
                this.lastCheeseTime = now;

                const noiseBuf = this.createNoiseBuffer(0.2);
                const noiseSrc = this.ctx.createBufferSource();
                
                // 1) 350Hz 이하 저음 전면 차단 (둥둥거리는 울림 제로)
                const highpass = this.ctx.createBiquadFilter();
                highpass.type = 'highpass';
                highpass.frequency.setValueAtTime(350, now);

                // 2) 800Hz -> 2800Hz 상승 습식 마찰 필터 (쮹- 쫀득하게 빨리는 느낌)
                const bandpass = this.ctx.createBiquadFilter();
                bandpass.type = 'bandpass';
                bandpass.frequency.setValueAtTime(800, now);
                bandpass.frequency.exponentialRampToValueAtTime(2800, now + 0.12);
                bandpass.frequency.exponentialRampToValueAtTime(1000, now + 0.19);
                bandpass.Q.setValueAtTime(3.2, now);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.19);

                noiseSrc.buffer = noiseBuf;
                noiseSrc.connect(highpass);
                highpass.connect(bandpass);
                bandpass.connect(gain);
                gain.connect(this.ctx.destination);

                noiseSrc.start(now);
                noiseSrc.stop(now + 0.2);

                setTimeout(() => {
                    this.isCheesePlaying = false;
                }, 280);
            }

            // 버터바 크런치 사운드
            playButterCrunch() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;

                if (now - this.lastCrunchTime < 0.25) return;
                this.lastCrunchTime = now;

                const pops = [1200, 850];
                pops.forEach((freq, idx) => {
                    const t = now + idx * 0.025;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, t);
                    osc.frequency.exponentialRampToValueAtTime(160, t + 0.02);

                    gain.gain.setValueAtTime(0.28, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.022);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(t);
                    osc.stop(t + 0.025);
                });
            }

            // 수박 샤베트 마찰음
            initSorbetLoop() {
                if (this.isSorbetRunning) return;
                this.init();

                const bufferSize = this.ctx.sampleRate * 2;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                this.sorbetSource = this.ctx.createBufferSource();
                this.sorbetSource.buffer = buffer;
                this.sorbetSource.loop = true;

                this.sorbetFilter = this.ctx.createBiquadFilter();
                this.sorbetFilter.type = 'bandpass';
                this.sorbetFilter.frequency.setValueAtTime(1200, this.ctx.currentTime);
                this.sorbetFilter.Q.setValueAtTime(1.8, this.ctx.currentTime);

                this.sorbetGain = this.ctx.createGain();
                this.sorbetGain.gain.setValueAtTime(0, this.ctx.currentTime);

                this.sorbetSource.connect(this.sorbetFilter);
                this.sorbetFilter.connect(this.sorbetGain);
                this.sorbetGain.connect(this.ctx.destination);

                this.sorbetSource.start();
                this.isSorbetRunning = true;
            }

            updateSorbetDrag(speed) {
                if (!this.enabled) return;
                this.initSorbetLoop();
                if (!this.sorbetGain) return;

                const now = this.ctx.currentTime;
                const targetGain = Math.min(speed * 1.5, 0.32);
                const targetFreq = 850 + Math.min(speed * 1800, 1600);

                this.sorbetGain.gain.setTargetAtTime(targetGain, now, 0.03);
                this.sorbetFilter.frequency.setTargetAtTime(targetFreq, now, 0.04);
            }

            stopSorbetDrag() {
                if (this.sorbetGain && this.ctx) {
                    this.sorbetGain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.08);
                }
            }

            // 왁스 파쇄 스냅 사운드
            playWaxCrackSnap() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;

                const noiseBuf = this.createNoiseBuffer(0.08);
                const noiseSrc = this.ctx.createBufferSource();
                const filter = this.ctx.createBiquadFilter();
                const gain = this.ctx.createGain();

                noiseSrc.buffer = noiseBuf;
                filter.type = 'highpass';
                filter.frequency.setValueAtTime(1800, now);

                gain.gain.setValueAtTime(0.45, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.075);

                noiseSrc.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                noiseSrc.start(now);
                noiseSrc.stop(now + 0.08);
            }

            playWaxShatter() {
                if (!this.enabled) return;
                this.init();
                for (let i = 0; i < 3; i++) {
                    setTimeout(() => this.playWaxCrackSnap(), i * 35);
                }
            }

            createNoiseBuffer(duration) {
                const bufferSize = this.ctx.sampleRate * duration;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                return buffer;
            }
        }

        const soundEngine = new RealSoundEngine();

        /* =========================================================================
           2. THREE.JS 3D Scene Setup
           ========================================================================= */
        let scene, camera, renderer, currentMeshGroup, mainMesh;
        let activeTab = 'mallang';
        let currentMallangType = 'butter';

        let originalPositions = null;
        let velocities = null;
        let activeGeometry = null;

        let isPointerDown = false;
        let pointerButton = 0;
        let isDragging = false;
        let grabbedVertexIndex = -1;
        let grabPlane = new THREE.Plane();
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let previousMousePosition = { x: 0, y: 0 };
        let pullTarget = new THREE.Vector3();

        let waxShellMesh = null;
        let waxCracksCanvas = null;
        let waxCracksTexture = null;
        let waxCrackContext = null;
        let waxCrackCount = 0;
        let isWaxShattered = false;
        let waxHoldTimer = null;
        let waxParticlesGroup = null;
        let currentTouchUV = null;

        function init3D() {
            const canvas = document.getElementById('webgl-canvas');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xfefeef);

            camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 3.2, 4.8);
            camera.lookAt(0, -0.1, 0);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.88);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.65);
            dirLight.position.set(3, 7, 4);
            dirLight.castShadow = true;
            scene.add(dirLight);

            currentMeshGroup = new THREE.Group();
            scene.add(currentMeshGroup);

            buildButterMallang();
            setupEventListeners();
            animate();
        }

        function setupPhysicsBuffers(geometry) {
            activeGeometry = geometry;
            const posAttr = geometry.attributes.position;
            const count = posAttr.count;

            originalPositions = new Float32Array(count * 3);
            velocities = new Float32Array(count * 3);

            for (let i = 0; i < count * 3; i++) {
                originalPositions[i] = posAttr.array[i];
                velocities[i] = 0;
            }
        }

        function clearCurrentGroup() {
            while (currentMeshGroup.children.length > 0) {
                const obj = currentMeshGroup.children[0];
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) {
                    if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
                    else obj.material.dispose();
                }
                currentMeshGroup.remove(obj);
            }
            waxShellMesh = null;
            if (waxParticlesGroup) {
                scene.remove(waxParticlesGroup);
                waxParticlesGroup = null;
            }
            currentMeshGroup.rotation.set(0, 0, 0);
            currentMeshGroup.position.set(0, 0, 0);
            currentMeshGroup.scale.set(1, 1, 1);
        }

        function buildButterMallang() {
            clearCurrentGroup();

            const labelCanvas = document.createElement('canvas');
            labelCanvas.width = 512;
            labelCanvas.height = 256;
            const ctx = labelCanvas.getContext('2d');

            ctx.fillStyle = '#f4d15d';
            ctx.fillRect(0, 0, 512, 256);
            ctx.textAlign = 'center';
            ctx.fillStyle = '#0e3a62';
            ctx.font = 'bold 32px sans-serif';
            ctx.fillText('4oz. NET WT.(113g)', 256, 70);
            ctx.font = '900 86px sans-serif';
            ctx.fillText('BUTTER', 256, 160);
            ctx.font = 'bold 30px sans-serif';
            ctx.fillText('SALTED', 256, 215);

            const butterTexture = new THREE.CanvasTexture(labelCanvas);
            const geometry = new THREE.BoxGeometry(2.4, 0.85, 0.95, 32, 16, 16);

            const sideMaterial = new THREE.MeshPhysicalMaterial({ color: 0xf5d461, roughness: 0.35, clearcoat: 0.3 });
            const topMaterial = new THREE.MeshPhysicalMaterial({ map: butterTexture, color: 0xf5d461, roughness: 0.35, clearcoat: 0.3 });

            mainMesh = new THREE.Mesh(geometry, [sideMaterial, sideMaterial, topMaterial, sideMaterial, sideMaterial, sideMaterial]);
            mainMesh.castShadow = true;
            currentMeshGroup.add(mainMesh);

            setupPhysicsBuffers(geometry);
        }

        function buildWatermelonMallang() {
            clearCurrentGroup();

            const seedCanvas = document.createElement('canvas');
            seedCanvas.width = 512;
            seedCanvas.height = 256;
            const ctx = seedCanvas.getContext('2d');

            ctx.fillStyle = '#ff2040';
            ctx.fillRect(0, 0, 512, 256);
            ctx.fillStyle = '#111111';
            for (let i = 0; i < 55; i++) {
                const x = Math.random() * 512;
                const y = Math.random() * 256;
                ctx.beginPath();
                ctx.ellipse(x, y, 4, 7, Math.random() * Math.PI, 0, Math.PI * 2);
                ctx.fill();
            }

            const seedTexture = new THREE.CanvasTexture(seedCanvas);
            const geometry = new THREE.SphereGeometry(0.7, 40, 40);

            const material = new THREE.MeshPhysicalMaterial({
                map: seedTexture,
                color: 0xff2e4c,
                roughness: 0.25,
                transmission: 0.2,
                clearcoat: 0.6
            });

            mainMesh = new THREE.Mesh(geometry, material);
            mainMesh.castShadow = true;
            currentMeshGroup.add(mainMesh);

            setupPhysicsBuffers(geometry);
        }

        function buildCheeseMallang() {
            clearCurrentGroup();

            const geometry = new THREE.BoxGeometry(1.3, 1.3, 1.3, 32, 32, 32);
            const pos = geometry.attributes.position;
            const pitCenters = [
                new THREE.Vector3(0.4, 0.3, 0.65),
                new THREE.Vector3(-0.35, -0.25, 0.65),
                new THREE.Vector3(0.65, -0.2, 0.3),
                new THREE.Vector3(-0.65, 0.25, -0.2)
            ];

            for (let i = 0; i < pos.count; i++) {
                let v = new THREE.Vector3(pos.getX(i), pos.getY(i), pos.getZ(i));
                for (let k = 0; k < pitCenters.length; k++) {
                    const center = pitCenters[k];
                    const dist = v.distanceTo(center);
                    if (dist < 0.32) {
                        const depth = Math.pow(1 - dist / 0.32, 2) * 0.22;
                        v.addScaledVector(center.clone().negate().normalize(), depth);
                    }
                }
                pos.setXYZ(i, v.x, v.y, v.z);
            }
            geometry.computeVertexNormals();

            const material = new THREE.MeshStandardMaterial({ color: 0xffeaa7, roughness: 0.35 });
            mainMesh = new THREE.Mesh(geometry, material);
            mainMesh.castShadow = true;
            currentMeshGroup.add(mainMesh);

            setupPhysicsBuffers(geometry);
        }

        function buildWaxBall() {
            clearCurrentGroup();
            waxCrackCount = 0;
            isWaxShattered = false;
            currentTouchUV = null;
            updateWaxHUD();

            // 속 알맹이: 연두색 (0x82cd47)
            const innerGeo = new THREE.SphereGeometry(1.05, 40, 40);
            const innerMat = new THREE.MeshPhysicalMaterial({
                color: 0x82cd47,
                roughness: 0.25,
                transmission: 0.2,
                clearcoat: 0.8
            });
            mainMesh = new THREE.Mesh(innerGeo, innerMat);
            mainMesh.castShadow = true;
            currentMeshGroup.add(mainMesh);

            // 외부 아이보리 왁스 껍질
            waxCracksCanvas = document.createElement('canvas');
            waxCracksCanvas.width = 512;
            waxCracksCanvas.height = 512;
            waxCrackContext = waxCracksCanvas.getContext('2d');

            waxCrackContext.fillStyle = '#f7f1e3';
            waxCrackContext.fillRect(0, 0, 512, 512);

            waxCracksTexture = new THREE.CanvasTexture(waxCracksCanvas);

            const waxGeo = new THREE.SphereGeometry(1.12, 40, 40);
            const waxMat = new THREE.MeshStandardMaterial({
                map: waxCracksTexture,
                roughness: 0.7,
                bumpMap: waxCracksTexture,
                bumpScale: 0.03
            });

            waxShellMesh = new THREE.Mesh(waxGeo, waxMat);
            waxShellMesh.castShadow = true;
            currentMeshGroup.add(waxShellMesh);

            setupPhysicsBuffers(innerGeo);
        }

        function drawLightningCrackAtHit(step, uv) {
            if (!waxCrackContext) return;

            let curX = 256;
            let curY = 220;

            if (uv) {
                curX = uv.x * 512;
                curY = (1 - uv.y) * 512;
            }

            if (step === 2) {
                curX += (Math.random() - 0.5) * 70;
                curY += (Math.random() - 0.5) * 70;
            } else if (step === 3) {
                curX += (Math.random() - 0.5) * 110;
                curY += (Math.random() - 0.5) * 110;
            }

            waxCrackContext.strokeStyle = '#1c1c20';
            waxCrackContext.lineWidth = 6;
            waxCrackContext.lineCap = 'round';
            waxCrackContext.lineJoin = 'miter';

            waxCrackContext.beginPath();
            waxCrackContext.moveTo(curX, curY);

            const segments = 4;
            let angle = Math.random() * Math.PI * 2;

            for (let i = 0; i < segments; i++) {
                angle += (i % 2 === 0 ? 0.85 : -0.85);
                const len = 42 + Math.random() * 25;
                curX += Math.cos(angle) * len;
                curY += Math.sin(angle) * len;
                waxCrackContext.lineTo(curX, curY);
            }
            waxCrackContext.stroke();

            waxCracksTexture.needsUpdate = true;
            soundEngine.playWaxCrackSnap();
        }

        function processWaxSqueezeStep() {
            if (isWaxShattered || activeTab !== 'wax') return;

            if (waxCrackCount < 3) {
                waxCrackCount++;
                updateWaxHUD();
                drawLightningCrackAtHit(waxCrackCount, currentTouchUV);
            } else if (waxCrackCount >= 3) {
                shatterWaxShell();
            }
        }

        function shatterWaxShell() {
            if (isWaxShattered) return;
            isWaxShattered = true;

            soundEngine.playWaxShatter();

            if (waxShellMesh) {
                waxShellMesh.visible = false;
            }

            waxParticlesGroup = new THREE.Group();
            scene.add(waxParticlesGroup);

            const shardGeo = new THREE.ConeGeometry(0.12, 0.2, 3);
            const shardMat = new THREE.MeshStandardMaterial({ color: 0xf7f1e3, roughness: 0.8 });

            for (let i = 0; i < 28; i++) {
                const shard = new THREE.Mesh(shardGeo, shardMat);
                shard.position.copy(currentMeshGroup.position);

                const vel = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.18,
                    Math.random() * 0.18 + 0.05,
                    (Math.random() - 0.5) * 0.18
                );

                shard.userData = {
                    velocity: vel,
                    rotSpeed: new THREE.Vector3(Math.random() * 0.2, Math.random() * 0.2, Math.random() * 0.2),
                    life: 1.0
                };
                waxParticlesGroup.add(shard);
            }

            const barContainer = document.getElementById('wax-bar-container');
            if (barContainer) barContainer.classList.add('hidden');
        }

        function rewrapWax() {
            if (activeTab === 'wax') {
                buildWaxBall();
                const barContainer = document.getElementById('wax-bar-container');
                if (barContainer) barContainer.classList.remove('hidden');
            }
        }

        function updateWaxHUD() {
            const bar = document.getElementById('crack-bar');
            if (bar) {
                const pct = Math.min((waxCrackCount / 3) * 100, 100);
                bar.style.width = `${pct}%`;
            }
        }

        /* =========================================================================
           3. 터치 및 드래그 반응
           ========================================================================= */
        function setupEventListeners() {
            const canvas = document.getElementById('webgl-canvas');
            document.addEventListener('contextmenu', e => e.preventDefault());

            canvas.addEventListener('pointerdown', onPointerDown);
            canvas.addEventListener('pointermove', onPointerMove);
            canvas.addEventListener('pointerup', onPointerUp);
            canvas.addEventListener('pointercancel', onPointerUp);

            window.addEventListener('resize', onWindowResize);
        }

        function updateMouseCoords(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        }

        function applyPressDent(hitPoint) {
            if (!activeGeometry || !mainMesh) return;

            const localHit = mainMesh.worldToLocal(hitPoint.clone());
            const posAttr = activeGeometry.attributes.position;

            for (let i = 0; i < posAttr.count; i++) {
                const vPos = new THREE.Vector3(posAttr.getX(i), posAttr.getY(i), posAttr.getZ(i));
                const dist = vPos.distanceTo(localHit);

                if (dist < 0.6) {
                    const factor = Math.cos((dist / 0.6) * (Math.PI / 2));
                    vPos.addScaledVector(localHit.clone().negate().normalize(), 0.18 * factor);
                    posAttr.setXYZ(i, vPos.x, vPos.y, vPos.z);
                }
            }

            posAttr.needsUpdate = true;
            activeGeometry.computeVertexNormals();

            currentMeshGroup.scale.set(1.06, 0.9, 1.06);

            if (activeTab === 'wax' && isWaxShattered) {
                soundEngine.playStickySquishSound();
            }
        }

        function onPointerDown(e) {
            isPointerDown = true;
            pointerButton = e.button;
            updateMouseCoords(e);

            previousMousePosition = { x: e.clientX, y: e.clientY };

            if (pointerButton === 0) {
                raycaster.setFromCamera(mouse, camera);

                const targetMesh = (waxShellMesh && waxShellMesh.visible) ? waxShellMesh : mainMesh;
                const intersects = raycaster.intersectObject(targetMesh);

                if (intersects.length > 0) {
                    const hit = intersects[0];
                    currentTouchUV = hit.uv;

                    if (activeTab === 'wax' && !isWaxShattered) {
                        processWaxSqueezeStep();
                        waxHoldTimer = setInterval(() => {
                            processWaxSqueezeStep();
                        }, 1000);
                        return;
                    }

                    applyPressDent(hit.point);
                    grabbedVertexIndex = findNearestVertex(hit.point);

                    if (grabbedVertexIndex !== -1) {
                        isDragging = true;
                        grabPlane.setFromNormalAndCoplanarPoint(
                            camera.getWorldDirection(new THREE.Vector3()).negate(),
                            hit.point
                        );
                    }
                }
            }
        }

        function onPointerMove(e) {
            if (!isPointerDown) return;

            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;
            const moveSpeed = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

            if (pointerButton === 2 || (isPointerDown && !isDragging)) {
                currentMeshGroup.rotation.y += deltaX * 0.008;
                currentMeshGroup.rotation.x += deltaY * 0.008;
            } else if (isDragging && grabbedVertexIndex !== -1) {
                updateMouseCoords(e);
                raycaster.setFromCamera(mouse, camera);

                if (raycaster.ray.intersectPlane(grabPlane, pullTarget)) {
                    applyVolumePreservingStretch(pullTarget, moveSpeed);
                }
            }

            previousMousePosition = { x: e.clientX, y: e.clientY };
        }

        function onPointerUp() {
            isPointerDown = false;
            isDragging = false;
            grabbedVertexIndex = -1;

            soundEngine.stopSorbetDrag();

            if (waxHoldTimer) {
                clearInterval(waxHoldTimer);
                waxHoldTimer = null;
            }
        }

        function findNearestVertex(worldPoint) {
            if (!activeGeometry) return -1;

            const localPoint = mainMesh.worldToLocal(worldPoint.clone());
            const posAttr = activeGeometry.attributes.position;
            let minDist = Infinity;
            let nearestIdx = -1;

            for (let i = 0; i < posAttr.count; i++) {
                const dist = localPoint.distanceToSquared(
                    new THREE.Vector3(posAttr.getX(i), posAttr.getY(i), posAttr.getZ(i))
                );
                if (dist < minDist) {
                    minDist = dist;
                    nearestIdx = i;
                }
            }
            return nearestIdx;
        }

        function applyVolumePreservingStretch(targetWorldPoint, moveSpeed) {
            if (grabbedVertexIndex === -1 || !activeGeometry) return;

            const targetLocal = mainMesh.worldToLocal(targetWorldPoint.clone());
            const posAttr = activeGeometry.attributes.position;

            const grabbedOrig = new THREE.Vector3(
                originalPositions[grabbedVertexIndex * 3],
                originalPositions[grabbedVertexIndex * 3 + 1],
                originalPositions[grabbedVertexIndex * 3 + 2]
            );

            const pullDir = targetLocal.clone().sub(grabbedOrig);
            const pullMag = pullDir.length();
            if (pullMag < 0.001) return;

            const influenceRadius = 1.2;

            for (let i = 0; i < posAttr.count; i++) {
                const idx = i * 3;
                const origPos = new THREE.Vector3(
                    originalPositions[idx],
                    originalPositions[idx + 1],
                    originalPositions[idx + 2]
                );

                const dist = origPos.distanceTo(grabbedOrig);

                if (dist < influenceRadius) {
                    const factor = Math.exp(-Math.pow(dist / (influenceRadius * 0.6), 2));
                    const finalPos = origPos.clone().add(pullDir.clone().multiplyScalar(factor * 0.55));
                    posAttr.setXYZ(i, finalPos.x, finalPos.y, finalPos.z);
                }
            }

            posAttr.needsUpdate = true;
            activeGeometry.computeVertexNormals();

            if (activeTab === 'wax' && isWaxShattered) {
                soundEngine.playStickySquishSound();
            } else if (currentMallangType === 'watermelon') {
                soundEngine.updateSorbetDrag(moveSpeed * 0.05);
            } else if (currentMallangType === 'cheese') {
                soundEngine.playStickySquishSound();
            } else if (currentMallangType === 'butter') {
                if (pullMag > 0.08) soundEngine.playButterCrunch();
            }
        }

        function updateVertexPhysics() {
            if (!activeGeometry) return;

            currentMeshGroup.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);
            if (isDragging) return;

            const posAttr = activeGeometry.attributes.position;
            const count = posAttr.count;
            const springK = 0.15;
            const damping = 0.82;
            let needsUpdate = false;

            for (let i = 0; i < count; i++) {
                const idx = i * 3;
                let px = posAttr.array[idx];
                let py = posAttr.array[idx + 1];
                let pz = posAttr.array[idx + 2];

                const ox = originalPositions[idx];
                const oy = originalPositions[idx + 1];
                const oz = originalPositions[idx + 2];

                let vx = (velocities[idx] - springK * (px - ox)) * damping;
                let vy = (velocities[idx + 1] - springK * (py - oy)) * damping;
                let vz = (velocities[idx + 2] - springK * (pz - oz)) * damping;

                velocities[idx] = vx;
                velocities[idx + 1] = vy;
                velocities[idx + 2] = vz;

                posAttr.array[idx] = px + vx;
                posAttr.array[idx + 1] = py + vy;
                posAttr.array[idx + 2] = pz + vz;

                if (Math.abs(vx) > 0.0001 || Math.abs(px - ox) > 0.0001) needsUpdate = true;
            }

            if (needsUpdate) {
                posAttr.needsUpdate = true;
                activeGeometry.computeVertexNormals();
            }
        }

        function updateParticles() {
            if (!waxParticlesGroup) return;

            for (let i = waxParticlesGroup.children.length - 1; i >= 0; i--) {
                const p = waxParticlesGroup.children[i];
                const u = p.userData;

                p.position.add(u.velocity);
                p.rotation.x += u.rotSpeed.x;
                p.rotation.y += u.rotSpeed.y;

                u.velocity.y -= 0.006;
                u.life -= 0.02;

                p.scale.setScalar(Math.max(u.life, 0.001));

                if (u.life <= 0) waxParticlesGroup.remove(p);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            updateVertexPhysics();
            updateParticles();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function switchTab(tab) {
            activeTab = tab;

            const btnMallang = document.getElementById('tab-mallang');
            const btnWax = document.getElementById('tab-wax');
            const mallangSelector = document.getElementById('mallang-selector');
            const waxBarContainer = document.getElementById('wax-bar-container');
            const btnReset = document.getElementById('btn-reset');

            if (tab === 'mallang') {
                btnMallang.classList.add('active');
                btnWax.classList.remove('active');

                mallangSelector.classList.remove('hidden');
                waxBarContainer.classList.add('hidden');
                btnReset.classList.add('hidden');

                selectMallang(currentMallangType);
            } else {
                btnWax.classList.add('active');
                btnMallang.classList.remove('active');

                mallangSelector.classList.add('hidden');

                if (!isWaxShattered) {
                    waxBarContainer.classList.remove('hidden');
                }
                btnReset.classList.remove('hidden');

                buildWaxBall();
            }
        }

        function selectMallang(type) {
            currentMallangType = type;

            ['butter', 'watermelon', 'cheese'].forEach(t => {
                const btn = document.getElementById(`btn-${t}`);
                if (t === type) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            if (type === 'butter') buildButterMallang();
            else if (type === 'watermelon') buildWatermelonMallang();
            else if (type === 'cheese') buildCheeseMallang();
        }

        function toggleSound() {
            soundEngine.enabled = !soundEngine.enabled;
            const soundIcon = document.getElementById('sound-icon');
            if (soundEngine.enabled) {
                soundIcon.className = 'fa-solid fa-volume-high text-lg';
            } else {
                soundIcon.className = 'fa-solid fa-volume-xmark text-lg text-red-500';
            }
        }

        window.onload = function() {
            init3D();
            switchTab('mallang');
        };
    </script>
</body>
</html>
