<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 동묘 벼룩시장 거리 탐방</title>
    <!-- SUIT Variable Font -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js r128 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --ink: #1C1C20;
            --paper: #FEFEFE;
            --g1: #E1E5EA;
            --r-pill: 38px;
        }

        * {
            font-family: 'SUIT Variable', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            box-sizing: border-box;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #fcfbf7;
        }

        .a2z-btn {
            background-color: var(--paper);
            color: var(--ink);
            border: 2px solid var(--ink);
            border-radius: var(--r-pill);
            font-weight: 800;
            transition: all 0.15s ease;
        }

        .a2z-btn:hover {
            background-color: var(--g1);
        }

        .a2z-btn.active {
            background-color: var(--ink);
            color: var(--paper);
        }

        #webgl-canvas {
            width: 100vw;
            height: 100vh;
            display: block;
            cursor: grab;
        }

        #webgl-canvas:active {
            cursor: grabbing;
        }

        /* 열전사 영수증 카드 */
        .mini-receipt {
            background: #fffef8;
            border: 2px solid var(--ink);
            position: relative;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.02) 2px, rgba(0,0,0,0.02) 4px);
        }
    </style>
</head>
<body class="relative">

    <!-- 3D WebGL Canvas -->
    <canvas id="webgl-canvas"></canvas>

    <!-- 상단 UI (HUD & 가게 뒤로가기 버튼) -->
    <div class="absolute top-5 left-0 right-0 z-20 flex flex-col items-center gap-2.5 px-4 pointer-events-none">
        
        <!-- 가게 내부 뷰 전용 뒤로가기 버튼 -->
        <div id="store-back-bar" class="pointer-events-auto hidden">
            <button onclick="exitStore()" class="a2z-btn px-5 py-2 text-xs md:text-sm bg-yellow-300 hover:bg-yellow-400 flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-arrow-left"></i>
                <span id="store-title-text">◀ 동묘 거리로 나가기</span>
            </button>
        </div>

        <!-- 소지금 및 득템 현황 HUD -->
        <div class="pointer-events-auto flex items-center gap-3 bg-[#FEFEFE] border-2 border-[#1C1C20] rounded-full px-5 py-1.5 shadow-sm text-xs md:text-sm font-black">
            <div>지갑: <span id="hud-budget" class="text-red-600">50,000원</span></div>
            <div class="w-0.5 h-3 bg-zinc-300"></div>
            <div>득템 보물: <span id="hud-count" class="text-blue-600">0개</span></div>
        </div>
    </div>

    <!-- 좌우 드래그 스크롤 가이드 팁 -->
    <div id="scroll-guide-tip" class="absolute top-20 left-0 right-0 z-10 text-center pointer-events-none transition-opacity duration-300">
        <span class="bg-[#1C1C20]/80 text-white text-[11px] font-bold px-3.5 py-1.5 rounded-full backdrop-blur-xs">
            👈 거리를 좌우로 드래그해서 구경하세요! 가게를 클릭하면 입장합니다 👉
        </span>
    </div>

    <!-- 하단 영수증 출력 버튼 -->
    <div class="absolute bottom-5 left-0 right-0 z-20 flex justify-center pointer-events-none px-4">
        <button onclick="toggleReceipt()" class="pointer-events-auto a2z-btn px-7 py-3 text-xs md:text-sm bg-yellow-300 hover:bg-yellow-400 shadow-md flex items-center gap-2">
            <i class="fa-solid fa-receipt text-base"></i>
            <span>동묘 득템 영수증 출력하기</span>
        </button>
    </div>

    <!-- 열전사 영수증 모달 -->
    <div id="receipt-modal" class="fixed inset-0 z-40 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="mini-receipt rounded-3xl p-6 max-w-sm w-full font-mono text-xs text-[#1C1C20] space-y-3.5 shadow-2xl border-2 border-[#1C1C20]">
            <div class="text-center pb-3 border-b-2 border-dashed border-[#1C1C20]">
                <div class="font-black text-lg">DONGMYO VINTAGE MARKET</div>
                <div class="text-[11px] text-zinc-500 mt-0.5">동묘 벼룩시장 득템 영수증</div>
            </div>

            <!-- 구매 내역 -->
            <div id="receipt-items-list" class="space-y-1.5 py-1 text-xs">
                <!-- JS dynamic list -->
            </div>

            <!-- 정산 집계 -->
            <div class="pt-2 border-t-2 border-dashed border-[#1C1C20] space-y-1 font-bold">
                <div class="flex justify-between">
                    <span>총 지출 금액:</span>
                    <span id="receipt-total" class="font-black text-red-600">0원</span>
                </div>
                <div class="flex justify-between text-zinc-500 text-[11px]">
                    <span>흥정 절약 혜택:</span>
                    <span id="receipt-saved" class="text-green-600">0원</span>
                </div>
                <div class="flex justify-between text-zinc-500 text-[11px]">
                    <span>남은 지갑 잔액:</span>
                    <span id="receipt-balance">50,000원</span>
                </div>
            </div>

            <!-- 득템 평가 칭호 -->
            <div class="text-center pt-2 border-t-2 border-dashed border-[#1C1C20]">
                <span id="receipt-badge" class="inline-block bg-[#1C1C20] text-white px-3 py-1 rounded-full text-xs font-bold">
                    "동묘 거리의 힙스터"
                </span>
            </div>

            <div class="flex gap-2 pt-1">
                <button onclick="resetShopping()" class="a2z-btn w-full py-2.5 text-xs bg-[#FEFEFE] hover:bg-[#E1E5EA]">
                    🔄 다시 둘러보기
                </button>
                <button onclick="toggleReceipt()" class="a2z-btn w-full py-2.5 text-xs bg-[#1C1C20] text-white hover:bg-zinc-800">
                    닫기
                </button>
            </div>
        </div>
    </div>

    <script>
        /* =========================================================================
           1. 효과음 엔진 (Web Audio API)
           ========================================================================= */
        class DongmyoAudioEngine {
            constructor() { this.ctx = null; }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') this.ctx.resume();
            }

            playBuy() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, now);
                osc.frequency.exponentialRampToValueAtTime(2400, now + 0.09);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.11);
            }

            playEnter() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.12);
            }

            playReceipt() {
                this.init();
                const now = this.ctx.currentTime;
                for (let i = 0; i < 5; i++) {
                    const bufSize = this.ctx.sampleRate * 0.015;
                    const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
                    const data = buf.getChannelData(0);
                    for (let j = 0; j < bufSize; j++) data[j] = Math.random() * 2 - 1;

                    const src = this.ctx.createBufferSource();
                    const filter = this.ctx.createBiquadFilter();
                    const gain = this.ctx.createGain();

                    src.buffer = buf;
                    filter.type = 'bandpass';
                    filter.frequency.setValueAtTime(3000 + i * 200, now + i * 0.04);

                    gain.gain.setValueAtTime(0.18, now + i * 0.04);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.04 + 0.02);

                    src.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);

                    src.start(now + i * 0.04);
                    src.stop(now + i * 0.04 + 0.02);
                }
            }
        }

        const soundEngine = new DongmyoAudioEngine();

        /* =========================================================================
           2. THREE.JS 3D 동묘 거리 & 파스텔 매장 모델링
           ========================================================================= */
        let scene, camera, renderer;
        
        let currentState = 'STREET';
        let currentStoreIndex = -1;

        const INITIAL_BUDGET = 50000;
        let budget = INITIAL_BUDGET;
        let boughtItems = [];

        const storeXPositions = [-6.8, 0.0, 6.8];
        let streetCamX = 0.0;
        let targetCamPos = new THREE.Vector3(0, 2.8, 9.8);
        let targetLookAt = new THREE.Vector3(0, 1.4, 0);
        let currentLookAt = new THREE.Vector3(0, 1.4, 0);

        let isDragging = false;
        let dragStartX = 0;
        let dragStartCamX = 0;
        let totalDragDistance = 0;

        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();

        let storeClickMeshes = [];
        let interactiveItems = [];

        function init3D() {
            const canvas = document.getElementById('webgl-canvas');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xfcfbf7);

            camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.copy(targetCamPos);
            camera.lookAt(targetLookAt);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            // 라이팅
            const ambientLight = new THREE.AmbientLight(0xfff9f0, 0.85);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfffae6, 0.95);
            sunLight.position.set(6, 12, 8);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 1024;
            sunLight.shadow.mapSize.height = 1024;
            scene.add(sunLight);

            const fillLight = new THREE.DirectionalLight(0xe0f2fe, 0.45);
            fillLight.position.set(-6, 2, -3);
            scene.add(fillLight);

            buildDongmyoStreet();
            setupEventListeners();
            animate();
        }

        /* -------------------------------------------------------------------------
           오픈 프론트 부스 방식의 파스텔 레트로 가게 및 외관 정체성 프롭 조립
           ------------------------------------------------------------------------- */
        function buildDongmyoStreet() {
            const roadMat = new THREE.MeshStandardMaterial({ color: 0xe7e5e4, roughness: 0.8 });
            const road = new THREE.Mesh(new THREE.BoxGeometry(32, 0.1, 8), roadMat);
            road.position.set(0, -0.05, 1);
            road.receiveShadow = true;
            scene.add(road);

            storeClickMeshes = [];
            interactiveItems = [];

            // =========================================================================
            // STORE 0: 👕 동묘 구제 옷집 (x = -6.8) - 파스텔 핑크/코랄
            // =========================================================================
            const store0 = new THREE.Group();
            store0.position.set(storeXPositions[0], 0, 0);

            const wallMat0 = new THREE.MeshStandardMaterial({ color: 0xffa0a0, roughness: 0.4 });
            const backWall0 = new THREE.Mesh(new THREE.BoxGeometry(4.4, 3.4, 0.2), wallMat0);
            backWall0.position.set(0, 1.7, -1.2);
            const sideWall0L = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3.4, 2.4), wallMat0);
            sideWall0L.position.set(-2.1, 1.7, 0);
            const sideWall0R = sideWall0L.clone();
            sideWall0R.position.x = 2.1;
            
            store0.add(backWall0, sideWall0L, sideWall0R);

            const awning0 = new THREE.Mesh(new THREE.BoxGeometry(4.6, 0.22, 0.8), new THREE.MeshStandardMaterial({ color: 0xff4d4d, roughness: 0.3 }));
            awning0.position.set(0, 3.2, 0.4);
            awning0.rotateX(0.2);
            store0.add(awning0);

            createStoreSign(store0, "👕 동묘 구제 옷집", 0, 3.8, 0.4);

            // [외관 정체성 1] 가게 앞 옷걸이 행거 가대
            const rackGroup = new THREE.Group();
            const pipeMat = new THREE.MeshStandardMaterial({ color: 0x18181b, metalness: 0.8 });
            const pL = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1.3), pipeMat);
            pL.position.set(-1.4, 0.65, 1.2);
            const pR = pL.clone();
            pR.position.x = -0.6;
            const pBar = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.85), pipeMat);
            pBar.rotateZ(Math.PI / 2);
            pBar.position.set(-1.0, 1.28, 1.2);
            rackGroup.add(pL, pR, pBar);

            const hangCloth1 = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.65, 0.08), new THREE.MeshStandardMaterial({ color: 0x2563eb }));
            hangCloth1.position.set(-1.15, 0.9, 1.2);
            const hangCloth2 = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.65, 0.08), new THREE.MeshStandardMaterial({ color: 0xf59e0b }));
            hangCloth2.position.set(-0.85, 0.9, 1.2);
            rackGroup.add(hangCloth1, hangCloth2);
            store0.add(rackGroup);

            // [외관 정체성 2] 마네킹
            const mannequin = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.12, 0.85, 16), new THREE.MeshStandardMaterial({ color: 0x10b981 }));
            mannequin.position.set(1.2, 0.6, 1.2);
            store0.add(mannequin);

            // --- 가게 내부 진열대 및 3D 보물 ---
            const counter0 = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.5, 0.9), new THREE.MeshStandardMaterial({ color: 0xffe4e6, roughness: 0.3 }));
            counter0.position.set(0, 0.25, 0.0);
            store0.add(counter0);

            // 3D 보물 1: 가죽 재킷
            const jacketGroup = createDetailedJacket();
            jacketGroup.position.set(-0.65, 0.8, 0.0);
            store0.add(jacketGroup);
            const tag1 = createPriceTag(jacketGroup, "80s 가죽재킷", "12,000원");

            interactiveItems.push({
                group: jacketGroup, tagSprite: tag1, id: 1, storeIndex: 0, name: "80s 가죽재킷", origPrice: 15000, price: 12000, icon: "🧥",
                isBought: false, origPos: new THREE.Vector3(-0.65, 0.8, 0.0)
            });

            // 3D 보물 2: Y2K 바람막이
            const windbreakerGroup = createDetailedWindbreaker();
            windbreakerGroup.position.set(0.65, 0.8, 0.0);
            store0.add(windbreakerGroup);
            const tag2 = createPriceTag(windbreakerGroup, "Y2K 바람막이", "8,000원");

            interactiveItems.push({
                group: windbreakerGroup, tagSprite: tag2, id: 2, storeIndex: 0, name: "Y2K 바람막이", origPrice: 10000, price: 8000, icon: "🥼",
                isBought: false, origPos: new THREE.Vector3(0.65, 0.8, 0.0)
            });

            scene.add(store0);
            backWall0.userData = { storeIndex: 0 };
            storeClickMeshes.push(backWall0);

            // =========================================================================
            // STORE 1: 📻 레트로 전자 상회 (x = 0.0) - 파스텔 민트/시안
            // =========================================================================
            const store1 = new THREE.Group();
            store1.position.set(storeXPositions[1], 0, 0);

            const wallMat1 = new THREE.MeshStandardMaterial({ color: 0x5eead4, roughness: 0.3 });
            const backWall1 = new THREE.Mesh(new THREE.BoxGeometry(4.4, 3.4, 0.2), wallMat1);
            backWall1.position.set(0, 1.7, -1.2);
            const sideWall1L = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3.4, 2.4), wallMat1);
            sideWall1L.position.set(-2.1, 1.7, 0);
            const sideWall1R = sideWall1L.clone();
            sideWall1R.position.x = 2.1;
            
            store1.add(backWall1, sideWall1L, sideWall1R);

            const awning1 = new THREE.Mesh(new THREE.BoxGeometry(4.6, 0.22, 0.8), new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.3 }));
            awning1.position.set(0, 3.2, 0.4);
            awning1.rotateX(0.2);
            store1.add(awning1);

            createStoreSign(store1, "📻 레트로 전자 상회", 0, 3.8, 0.4);

            // [외관 정체성] CRT 레트로 TV 스피커 탑
            const tvMat = new THREE.MeshStandardMaterial({ color: 0x3f3f46, roughness: 0.4 });
            const tvScreenMat = new THREE.MeshPhysicalMaterial({ color: 0x38bdf8, roughness: 0.1, clearcoat: 0.9, emissive: 0x0284c7, emissiveIntensity: 0.2 });
            
            const tv1 = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.52, 0.5), tvMat);
            tv1.position.set(-1.3, 0.26, 1.2);
            const scr1 = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.38, 0.02), tvScreenMat);
            scr1.position.set(-1.3, 0.26, 1.46);

            const tv2 = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.42, 0.45), tvMat);
            tv2.position.set(-1.3, 0.73, 1.2);
            const scr2 = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.3, 0.02), tvScreenMat);
            scr2.position.set(-1.3, 0.73, 1.43);

            store1.add(tv1, scr1, tv2, scr2);

            // --- 가게 내부 진열대 및 3D 보물 ---
            const counter1 = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.5, 0.9), new THREE.MeshStandardMaterial({ color: 0xccfbf1, roughness: 0.3 }));
            counter1.position.set(0, 0.25, 0.0);
            store1.add(counter1);

            // 3D 보물 3: Y2K 디카
            const cameraGroup = createDetailedCamera();
            cameraGroup.position.set(-0.65, 0.7, 0.0);
            store1.add(cameraGroup);
            const tag3 = createPriceTag(cameraGroup, "Y2K 컴팩트디카", "18,000원");

            interactiveItems.push({
                group: cameraGroup, tagSprite: tag3, id: 3, storeIndex: 1, name: "Y2K 컴팩트디카", origPrice: 22000, price: 18000, icon: "📷",
                isBought: false, origPos: new THREE.Vector3(-0.65, 0.7, 0.0)
            });

            // 3D 보물 4: 레트로 붐박스
            const boomboxGroup = createDetailedBoombox();
            boomboxGroup.position.set(0.65, 0.75, 0.0);
            store1.add(boomboxGroup);
            const tag4 = createPriceTag(boomboxGroup, "레트로 붐박스", "15,000원");

            interactiveItems.push({
                group: boomboxGroup, tagSprite: tag4, id: 4, storeIndex: 1, name: "레트로 붐박스", origPrice: 19000, price: 15000, icon: "📻",
                isBought: false, origPos: new THREE.Vector3(0.65, 0.75, 0.0)
            });

            scene.add(store1);
            backWall1.userData = { storeIndex: 1 };
            storeClickMeshes.push(backWall1);

            // =========================================================================
            // STORE 2: 👓 동묘 골동품 만물상 (x = 6.8) - 버터 옐로우/바닐라
            // =========================================================================
            const store2 = new THREE.Group();
            store2.position.set(storeXPositions[2], 0, 0);

            const wallMat2 = new THREE.MeshStandardMaterial({ color: 0xfde047, roughness: 0.4 });
            const backWall2 = new THREE.Mesh(new THREE.BoxGeometry(4.4, 3.4, 0.2), wallMat2);
            backWall2.position.set(0, 1.7, -1.2);
            const sideWall2L = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3.4, 2.4), wallMat2);
            sideWall2L.position.set(-2.1, 1.7, 0);
            const sideWall2R = sideWall2L.clone();
            sideWall2R.position.x = 2.1;
            
            store2.add(backWall2, sideWall2L, sideWall2R);

            const awning2 = new THREE.Mesh(new THREE.BoxGeometry(4.6, 0.22, 0.8), new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.3 }));
            awning2.position.set(0, 3.2, 0.4);
            awning2.rotateX(0.2);
            store2.add(awning2);

            createStoreSign(store2, "👓 골동품 만물상", 0, 3.8, 0.4);

            // [외관 정체성] 대형 앤티크 괘종시계
            const clockFrame = new THREE.Mesh(new THREE.BoxGeometry(0.65, 1.1, 0.15), new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.5 }));
            clockFrame.position.set(1.3, 1.6, 1.2);
            const clockFace = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.04, 24), new THREE.MeshStandardMaterial({ color: 0xfff0bb }));
            clockFace.rotateX(Math.PI / 2);
            clockFace.position.set(1.3, 1.8, 1.28);
            store2.add(clockFrame, clockFace);

            // --- 가게 내부 진열대 및 3D 보물 ---
            const counter2 = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.5, 0.9), new THREE.MeshStandardMaterial({ color: 0xfef9c3, roughness: 0.3 }));
            counter2.position.set(0, 0.25, 0.0);
            store2.add(counter2);

            // 3D 보물 5: 틴트 선글라스
            const glassGroup = createDetailedSunglasses();
            glassGroup.position.set(-0.65, 0.65, 0.0);
            store2.add(glassGroup);
            const tag5 = createPriceTag(glassGroup, "틴트 선글라스", "5,500원");

            interactiveItems.push({
                group: glassGroup, tagSprite: tag5, id: 5, storeIndex: 2, name: "틴트 선글라스", origPrice: 7000, price: 5500, icon: "🕶️",
                isBought: false, origPos: new THREE.Vector3(-0.65, 0.65, 0.0)
            });

            // 3D 보물 6: 태엽 시계
            const watchGroup = createDetailedWatch();
            watchGroup.position.set(0.65, 0.65, 0.0);
            store2.add(watchGroup);
            const tag6 = createPriceTag(watchGroup, "태엽 손목시계", "11,000원");

            interactiveItems.push({
                group: watchGroup, tagSprite: tag6, id: 6, storeIndex: 2, name: "태엽 손목시계", origPrice: 14000, price: 11000, icon: "⌚",
                isBought: false, origPos: new THREE.Vector3(0.65, 0.65, 0.0)
            });

            scene.add(store2);
            backWall2.userData = { storeIndex: 2 };
            storeClickMeshes.push(backWall2);

            updateItemsVisibility();
        }

        /* -------------------------------------------------------------------------
           상품 세부 디테일 3D 생성 함수들
           ------------------------------------------------------------------------- */
        function createDetailedJacket() {
            const group = new THREE.Group();
            const leatherMat = new THREE.MeshPhysicalMaterial({ color: 0x18181b, roughness: 0.2, clearcoat: 0.8 });
            
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.75, 0.22), leatherMat);
            const collarL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.15, 0.05), leatherMat);
            collarL.position.set(-0.15, 0.32, 0.12);
            collarL.rotateZ(-0.2);
            const collarR = collarL.clone();
            collarR.position.x = 0.15;
            collarR.rotateZ(0.4);

            const armL = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.65, 0.18), leatherMat);
            armL.position.set(-0.38, -0.05, 0);
            const armR = armL.clone();
            armR.position.x = 0.38;

            const zipper = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.7, 0.02), new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.9 }));
            zipper.position.set(0, 0, 0.12);

            group.add(body, collarL, collarR, armL, armR, zipper);
            return group;
        }

        function createDetailedWindbreaker() {
            const group = new THREE.Group();
            const mat1 = new THREE.MeshStandardMaterial({ color: 0xec4899, roughness: 0.3 });
            const mat2 = new THREE.MeshStandardMaterial({ color: 0x06b6d4, roughness: 0.3 });
            const mat3 = new THREE.MeshStandardMaterial({ color: 0xeab308, roughness: 0.3 });

            const upper = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.26, 0.2), mat1);
            upper.position.y = 0.2;
            const mid = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.26, 0.2), mat2);
            mid.position.y = -0.04;
            const lower = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.22, 0.2), mat3);
            lower.position.y = -0.26;

            const zipper = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.72, 0.02), new THREE.MeshStandardMaterial({ color: 0xffffff }));
            zipper.position.set(0, -0.02, 0.11);

            group.add(upper, mid, lower, zipper);
            return group;
        }

        function createDetailedCamera() {
            const group = new THREE.Group();
            const camMat = new THREE.MeshStandardMaterial({ color: 0xe5e7eb, metalness: 0.9, roughness: 0.15 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.34, 0.16), camMat);

            const lensMat = new THREE.MeshPhysicalMaterial({ color: 0x111111, roughness: 0.1, clearcoat: 1.0 });
            const lensRing1 = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.06, 24), camMat);
            lensRing1.rotateX(Math.PI / 2);
            lensRing1.position.set(0.08, 0, 0.1);
            const lensGlass = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.08, 24), lensMat);
            lensGlass.rotateX(Math.PI / 2);
            lensGlass.position.set(0.08, 0, 0.12);

            const flash = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.07, 0.04), new THREE.MeshStandardMaterial({ color: 0xfff0bb }));
            flash.position.set(-0.16, 0.1, 0.09);

            group.add(body, lensRing1, lensGlass, flash);
            return group;
        }

        function createDetailedBoombox() {
            const group = new THREE.Group();
            const bbMat = new THREE.MeshStandardMaterial({ color: 0x27272a, roughness: 0.3 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.42, 0.28), bbMat);

            const spkMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.5 });
            const spkL = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.04, 20), spkMat);
            spkL.rotateX(Math.PI / 2);
            spkL.position.set(-0.25, 0, 0.13);
            const spkR = spkL.clone();
            spkR.position.x = 0.25;

            const handle = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.06, 0.06), bbMat);
            handle.position.set(0, 0.26, 0);

            group.add(body, spkL, spkR, handle);
            return group;
        }

        function createDetailedSunglasses() {
            const group = new THREE.Group();
            const goldMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.9, roughness: 0.2 });
            const lensMat = new THREE.MeshPhysicalMaterial({ color: 0xf59e0b, transmission: 0.85, transparent: true, roughness: 0.1 });

            const rimL = new THREE.Mesh(new THREE.TorusGeometry(0.11, 0.018, 12, 24), goldMat);
            rimL.position.x = -0.13;
            const rimR = rimL.clone();
            rimR.position.x = 0.13;

            const lensL = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.015, 20), lensMat);
            lensL.rotateX(Math.PI / 2);
            lensL.position.x = -0.13;
            const lensR = lensL.clone();
            lensR.position.x = 0.13;

            group.add(rimL, rimR, lensL, lensR);
            return group;
        }

        function createDetailedWatch() {
            const group = new THREE.Group();
            const goldMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.9, roughness: 0.2 });
            
            const wCase = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.05, 24), goldMat);
            const wGlass = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.02, 24), new THREE.MeshPhysicalMaterial({ color: 0xffffff, transmission: 0.9, transparent: true }));
            wGlass.position.y = 0.03;

            const strapMat = new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.6 });
            const strap1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.02, 0.32), strapMat);
            strap1.position.z = 0.2;
            const strap2 = strap1.clone();
            strap2.position.z = -0.2;

            group.add(wCase, wGlass, strap1, strap2);
            return group;
        }

        /* 고해상도 A2Z 간판 스프라이트 */
        function createStoreSign(parentGroup, text, x, y, z) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#FEFEFE';
            ctx.roundRect(16, 16, 992, 224, 112);
            ctx.fill();
            ctx.lineWidth = 16;
            ctx.strokeStyle = '#1C1C20';
            ctx.stroke();

            ctx.fillStyle = '#1C1C20';
            ctx.font = 'bold 84px SUIT, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 512, 128);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, depthTest: false });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(3.0, 0.75, 1);
            sprite.position.set(x, y, z);
            parentGroup.add(sprite);
        }

        /* 3D 보물 가격 태그 (최우선 렌더링 설정 적용) */
        function createPriceTag(parentGroup, title, priceText) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#1C1C20';
            ctx.roundRect(10, 10, 492, 236, 40);
            ctx.fill();
            ctx.lineWidth = 12;
            ctx.strokeStyle = '#FEFEFE';
            ctx.stroke();

            ctx.fillStyle = '#FEFEFE';
            ctx.font = 'bold 48px SUIT, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(title, 256, 90);

            ctx.fillStyle = '#FFD600';
            ctx.font = 'black 54px SUIT, sans-serif';
            ctx.fillText(priceText, 256, 175);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, depthTest: false, renderOrder: 999 });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(0.68, 0.34, 1);
            sprite.position.set(0, 0.42, 0);
            parentGroup.add(sprite);
            return sprite;
        }

        /* 득템 후 가격표 텍스트 업데이트 (✨ 득템 완료!) */
        function updatePriceTagBought(sprite, title) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#1C1C20';
            ctx.roundRect(10, 10, 492, 236, 40);
            ctx.fill();
            ctx.lineWidth = 12;
            ctx.strokeStyle = '#22c55e';
            ctx.stroke();

            ctx.fillStyle = '#FEFEFE';
            ctx.font = 'bold 44px SUIT, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(title, 256, 90);

            ctx.fillStyle = '#4ade80';
            ctx.font = 'black 52px SUIT, sans-serif';
            ctx.fillText('✨ 득템 완료!', 256, 175);

            sprite.material.map = new THREE.CanvasTexture(canvas);
            sprite.material.map.needsUpdate = true;
        }

        /* 뷰 상태별 3D 보물 아이템 노출 제어 */
        function updateItemsVisibility() {
            interactiveItems.forEach(item => {
                if (currentState === 'STORE' && item.storeIndex === currentStoreIndex) {
                    item.group.visible = true;
                    item.tagSprite.visible = true;
                } else {
                    item.group.visible = false;
                    item.tagSprite.visible = false;
                }
            });
        }

        /* =========================================================================
           3. 카메라 스무스 이동 및 상태 전환 (거리 뷰 ↔ 진열대 뷰)
           ========================================================================= */
        function enterStore(index) {
            soundEngine.playEnter();
            currentState = 'STORE';
            currentStoreIndex = index;

            const targetX = storeXPositions[index];
            targetCamPos.set(targetX, 1.2, 3.6);  // 여유로운 줌인 거리 확보
            targetLookAt.set(targetX, 0.7, 0.0);

            updateItemsVisibility();

            // UI 제어
            document.getElementById('scroll-guide-tip').classList.add('opacity-0');
            document.getElementById('store-back-bar').classList.remove('hidden');

            const names = ['👕 동묘 구제 옷집', '📻 동묘 레트로 전자 상회', '👓 동묘 골동품 만물상'];
            document.getElementById('store-title-text').innerText = `◀ ${names[index]}에서 나가기`;
        }

        function exitStore() {
            currentState = 'STREET';
            currentStoreIndex = -1;

            targetCamPos.set(streetCamX, 2.8, 9.8);
            targetLookAt.set(streetCamX, 1.4, 0);

            updateItemsVisibility();

            // UI 제어
            document.getElementById('scroll-guide-tip').classList.remove('opacity-0');
            document.getElementById('store-back-bar').classList.add('hidden');
        }

        /* =========================================================================
           4. 마우스 & 터치 드래그 스크롤 & 터치 득템 인터랙션
           ========================================================================= */
        function setupEventListeners() {
            const canvas = document.getElementById('webgl-canvas');
            document.addEventListener('contextmenu', e => e.preventDefault());

            canvas.addEventListener('pointerdown', onPointerDown);
            canvas.addEventListener('pointermove', onPointerMove);
            canvas.addEventListener('pointerup', onPointerUp);

            window.addEventListener('resize', onWindowResize);
        }

        function updateMouseCoords(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        }

        function onPointerDown(e) {
            isDragging = true;
            dragStartX = e.clientX;
            dragStartCamX = streetCamX;
            totalDragDistance = 0;
            updateMouseCoords(e);
        }

        function onPointerMove(e) {
            if (!isDragging) return;

            const deltaX = e.clientX - dragStartX;
            totalDragDistance += Math.abs(deltaX);

            if (currentState === 'STREET') {
                // 거리 뷰에서 드래그 스크롤 (X축 범위 -7.8 ~ +7.8)
                streetCamX = dragStartCamX - deltaX * 0.009;
                streetCamX = Math.max(-7.8, Math.min(7.8, streetCamX));

                targetCamPos.x = streetCamX;
                targetLookAt.x = streetCamX;
            }
        }

        function onPointerUp(e) {
            isDragging = false;
            updateMouseCoords(e);

            // 단순 클릭 시 (드래그 미발생)
            if (totalDragDistance < 8) {
                raycaster.setFromCamera(mouse, camera);

                if (currentState === 'STREET') {
                    // 거리 뷰: 가게 클릭 시 해당 가게로 입장
                    const intersects = raycaster.intersectObjects(storeClickMeshes, true);
                    if (intersects.length > 0) {
                        const hitObj = intersects[0].object;
                        if (hitObj.userData.storeIndex !== undefined) {
                            enterStore(hitObj.userData.storeIndex);
                        }
                    }
                } else if (currentState === 'STORE') {
                    // 가게 내부 뷰: 3D 보물 아이템 클릭 시 득템
                    for (let i = 0; i < interactiveItems.length; i++) {
                        const item = interactiveItems[i];
                        if (item.storeIndex !== currentStoreIndex) continue;

                        const intersects = raycaster.intersectObject(item.group, true);
                        if (intersects.length > 0) {
                            if (!item.isBought) {
                                if (budget < item.price) {
                                    alert('지갑 잔액이 부족합니다!');
                                    return;
                                }

                                item.isBought = true;
                                boughtItems.push(item);
                                budget -= item.price;

                                updatePriceTagBought(item.tagSprite, item.name);

                                soundEngine.playBuy();
                                updateHUD();
                            }
                            break;
                        }
                    }
                }
            }
        }

        function updateHUD() {
            document.getElementById('hud-budget').innerText = `${budget.toLocaleString()}원`;
            document.getElementById('hud-count').innerText = `${boughtItems.length}개`;
        }

        /* -------------------------------------------------------------------------
           3D 물리 및 카메라 보간 프레임 업데이트
           ------------------------------------------------------------------------- */
        function updatePhysics() {
            camera.position.lerp(targetCamPos, 0.08);
            currentLookAt.lerp(targetLookAt, 0.08);
            camera.lookAt(currentLookAt);

            // 득템한 3D 오브젝트 공중 부양 회전 애니메이션
            interactiveItems.forEach(item => {
                if (item.isBought) {
                    const targetY = item.origPos.y + 0.25;
                    item.group.position.y += (targetY - item.group.position.y) * 0.1;
                    item.group.rotation.y += 0.03;
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        /* =========================================================================
           5. 영수증 출력 모달
           ========================================================================= */
        function toggleReceipt() {
            if (boughtItems.length === 0) {
                alert('동묘 상점에 입장해 마음에 드는 3D 보물을 클릭해 득템해보세요!');
                return;
            }

            const modal = document.getElementById('receipt-modal');
            const isHidden = modal.classList.contains('hidden');

            if (isHidden) {
                soundEngine.playReceipt();
                renderReceiptList();
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        function renderReceiptList() {
            const container = document.getElementById('receipt-items-list');
            container.innerHTML = '';

            let totalSpent = 0;
            let totalSaved = 0;

            boughtItems.forEach(item => {
                totalSpent += item.price;
                const saved = item.origPrice - item.price;
                totalSaved += saved;

                const row = document.createElement('div');
                row.className = 'flex justify-between items-center';
                row.innerHTML = `
                    <span>${item.icon} ${item.name}</span>
                    <span class="font-bold">${item.price.toLocaleString()}원</span>
                `;
                container.appendChild(row);
            });

            document.getElementById('receipt-total').innerText = `${totalSpent.toLocaleString()}원`;
            document.getElementById('receipt-saved').innerText = `-${totalSaved.toLocaleString()}원`;
            document.getElementById('receipt-balance').innerText = `${budget.toLocaleString()}원`;

            const badge = document.getElementById('receipt-badge');
            if (totalSaved >= 4000) {
                badge.innerText = '"동묘 협상의 신 (네고 마스터)"';
            } else if (totalSpent >= 25000) {
                badge.innerText = '"동묘 힙스터 트렌드세터"';
            } else {
                badge.innerText = '"알뜰한 레트로 수집가"';
            }
        }

        function resetShopping() {
            budget = INITIAL_BUDGET;
            boughtItems = [];

            interactiveItems.forEach(item => {
                item.isBought = false;
                item.group.position.copy(item.origPos);
                item.group.rotation.y = 0;
                
                // 가격 태그 재설정
                createPriceTag(item.group, item.name, `${item.price.toLocaleString()}원`);
            });

            document.getElementById('receipt-modal').classList.add('hidden');
            exitStore();
            updateHUD();
        }

        window.onload = function() {
            init3D();
        };
    </script>
</body>
